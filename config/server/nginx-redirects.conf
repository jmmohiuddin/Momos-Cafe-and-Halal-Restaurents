# Momo's platform — HTTP→HTTPS and canonical host for nginx (FR-FND-004, Doc 11 SEC-050, TC-SEC-005).
# Include at http { } level (next to the site's HTTPS server block that includes nginx-momos.conf).
# Every http:// request, and https:// on a non-canonical name (www.), answers with ONE 301 to
# https://<canonical host><same path and query>. The host placeholders are filled in by bin/build-release.sh
# (MOMOS_CANONICAL_HOST; MOMOS_ALIAS_HOSTS defaults to "www.<canonical host>").
# TLS: protocols TLSv1.2 TLSv1.3 only (SEC-050); certificates are the host's (Let's Encrypt / CDN edge).
# HSTS is sent by the application (Access\Http\SecurityHeaders, G3 ramp), not here.

server {
	listen 80;
	listen [::]:80;
	server_name __MOMOS_CANONICAL_HOST__ __MOMOS_ALIAS_HOSTS__;
	server_tokens off;
	# ACME HTTP-01 challenges stay reachable over HTTP for certificate renewal.
	location ^~ /.well-known/acme-challenge/ { default_type text/plain; try_files $uri =404; }
	location / { return 301 https://__MOMOS_CANONICAL_HOST__$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name __MOMOS_ALIAS_HOSTS__;
	server_tokens off;
	ssl_protocols TLSv1.2 TLSv1.3;
	# ssl_certificate / ssl_certificate_key: the same certificate as the canonical server (it must cover the aliases).
	return 301 https://__MOMOS_CANONICAL_HOST__$request_uri;
}
