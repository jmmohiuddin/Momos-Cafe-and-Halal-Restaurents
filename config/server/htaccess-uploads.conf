# Momo's platform — /wp-content/uploads/.htaccess (SEC-028, SEC-042, access-security-privacy.md §7.7/§9.3).
# Also used for the private evidence directory (MOMOS_EVIDENCE_DIR) when it cannot live outside the web root:
# there, replace everything below with "Require all denied".

Options -Indexes -ExecCGI
# Never execute or serve scripts that reach the media library.
<FilesMatch "\.(php\d?|phtml|phar|pht|pl|py|cgi|sh|shtml|asp|aspx|jsp)$">
	Require all denied
</FilesMatch>
<IfModule mod_php.c>
	php_flag engine off
</IfModule>
<IfModule mod_php7.c>
	php_flag engine off
</IfModule>
RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phar .pl .py .cgi
RemoveType .php .phtml .php3 .php4 .php5 .php7 .php8 .phar
<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
</IfModule>
