# Momo's platform — web-server deny rules for the WordPress root (SEC-042, access-security-privacy.md §9.3).
# Apache 2.4 / LiteSpeed (Hostinger): place ABOVE the "# BEGIN WordPress" block of /.htaccess.
# Shipped by bin/build-release.sh as server/htaccess-root.conf; nginx equivalent: nginx-momos.conf.

Options -Indexes
ServerSignature Off

# Dot-files and dot-directories (.git, .env, .user.ini, .htaccess …) except /.well-known/.
RedirectMatch 403 /\.(?!well-known/)

# WordPress files that disclose versions or configuration.
<FilesMatch "^(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|xmlrpc\.php|debug\.log|error_log|\.user\.ini|php\.ini|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml(\.dist)?)$">
	Require all denied
</FilesMatch>

# Backups, archives, logs, environment and build files.
<FilesMatch "\.(sql|bak|old|orig|save|swp|swo|dist|zip|tar|gz|tgz|7z|rar|log|env|ini|sh|yml|yaml|lock|md|po|pot|mo)$">
	Require all denied
</FilesMatch>

<IfModule mod_rewrite.c>
	RewriteEngine On
	# Installer and upgrade scripts are never needed over HTTP (installs/updates run through WP-CLI, DEC-065).
	RewriteRule ^wp-admin/(install|setup-config|upgrade)\.php$ - [F,L]
	# No direct requests to PHP files under wp-includes/ or wp-admin/includes/.
	RewriteRule ^wp-admin/includes/ - [F,L]
	RewriteRule !^wp-includes/ - [S=3]
	RewriteRule ^wp-includes/[^/]+\.php$ - [F,L]
	RewriteRule ^wp-includes/js/tinymce/langs/.+\.php - [F,L]
	RewriteRule ^wp-includes/theme-compat/ - [F,L]
	# No PHP execution anywhere below wp-content/uploads/ (see htaccess-uploads.conf as well).
	RewriteRule ^wp-content/uploads/.*\.(php\d?|phtml|phar|pl|py|cgi|sh)$ - [F,L]
	# Vendor and test sources of momos-core / theme are not web assets.
	RewriteRule ^wp-content/(plugins/momos-core|themes/momos)/(vendor|tests|node_modules|bin)/ - [F,L]
	RewriteRule ^wp-content/(plugins/momos-core/(src|config|templates|languages)/|plugins/momos-core/momos-core\.php) - [F,L]
</IfModule>

# Response headers that must be on cached responses too (spec §8).
<IfModule mod_headers.c>
	Header always unset X-Powered-By
	Header always unset X-Pingback
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
</IfModule>
