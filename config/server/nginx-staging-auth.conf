# Staging only (FR-FND-002, FR-SEO-009, TRD §6.1): HTTP basic auth in front of the whole site.
# include inside the staging HTTPS server { } block, before the momos rules. Never on production.
# Create the password file outside the web root:  htpasswd -c /etc/nginx/.htpasswd-staging <user>
auth_basic "Staging";
auth_basic_user_file REPLACE_WITH_ABSOLUTE_HTPASSWD_PATH;

# Certificate renewal must stay reachable without credentials.
location ^~ /.well-known/acme-challenge/ {
	auth_basic off;
}
