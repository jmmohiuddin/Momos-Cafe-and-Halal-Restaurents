# Momo's platform — nginx equivalent of htaccess-root.conf + htaccess-uploads.conf (SEC-042, spec §9.3).
# Include inside the site's HTTPS `server { listen 443 ssl; server_name <canonical host>; … }` block
# BEFORE the generic `location ~ \.php$` block. The HTTP→HTTPS and www→canonical 301s are in
# nginx-redirects.conf (separate server blocks). HSTS comes from Access\Http\SecurityHeaders (G3 ramp), so
# no Strict-Transport-Security header is added here.

# Canonical host inside the HTTPS server (FR-FND-004, TC-SEC-005): any other Host → one 301.
if ($host != "__MOMOS_CANONICAL_HOST__") { return 301 https://__MOMOS_CANONICAL_HOST__$request_uri; }

autoindex off;
server_tokens off;
fastcgi_hide_header X-Powered-By;
fastcgi_hide_header X-Pingback;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Dot-files and dot-directories except /.well-known/.
location ~ /\.(?!well-known/) { deny all; return 403; }

# Version / configuration disclosure.
location ~* ^/(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|xmlrpc\.php|debug\.log|error_log|\.user\.ini|php\.ini|composer\.(json|lock)|package(-lock)?\.json)$ { deny all; return 403; }
location ~* /(debug\.log|error_log)$ { deny all; return 403; }

# Backups, archives, logs, environment and build files.
location ~* \.(sql|bak|old|orig|save|swp|swo|dist|zip|tar|gz|tgz|7z|rar|log|env|ini|sh|yml|yaml|lock|md|po|pot|mo)$ { deny all; return 403; }

# Installer/upgrade scripts and direct PHP under wp-includes / wp-admin/includes.
location ~* ^/wp-admin/(install|setup-config|upgrade)\.php$ { deny all; return 403; }
location ~* ^/wp-admin/includes/ { deny all; return 403; }
location ~* ^/wp-includes/[^/]+\.php$ { deny all; return 403; }
location ~* ^/wp-includes/theme-compat/ { deny all; return 403; }

# No script execution below uploads (media library) — SEC-028.
location ~* ^/wp-content/uploads/.*\.(php\d?|phtml|phar|pht|pl|py|cgi|sh)$ { deny all; return 403; }

# Plugin/theme sources that are not web assets.
location ~* ^/wp-content/(plugins/momos-core|themes/momos)/(vendor|tests|node_modules|bin)/ { deny all; return 403; }
location ~* ^/wp-content/plugins/momos-core/(src|config|templates|languages)/ { deny all; return 403; }
