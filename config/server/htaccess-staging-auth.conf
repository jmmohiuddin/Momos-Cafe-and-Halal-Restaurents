# Staging only (FR-FND-002, FR-SEO-009, TRD §6.1): HTTP basic auth in front of the whole site.
# Install at the very top of /.htaccess on STAGING (above the htaccess-root.conf rules). Never on production.
# Create the password file outside the web root:  htpasswd -c /home/<account>/.htpasswd-staging <user>
# Playwright/QA against staging: set httpCredentials in the config or MOMOS_E2E_HTTP_USER/PASS.
AuthType Basic
AuthName "Staging"
AuthUserFile REPLACE_WITH_ABSOLUTE_HTPASSWD_PATH
Require valid-user

# Certificate renewal must stay reachable without credentials.
<If "%{REQUEST_URI} =~ m#^/\.well-known/acme-challenge/#">
	Require all granted
</If>
